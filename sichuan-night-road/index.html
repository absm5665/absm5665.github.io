<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>乡道 · 20:30</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#04060b; overflow:hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    color:#e6dfd2; -webkit-font-smoothing:antialiased;
  }
  canvas { display:block; }

  /* ---------- 画面后处理：暗角 + 微弱颗粒 ---------- */
  .vignette {
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:
      radial-gradient(ellipse 78% 68% at 50% 50%, rgba(0,0,0,0) 30%, rgba(3,5,10,0.35) 68%, rgba(2,3,7,0.82) 100%),
      linear-gradient(to bottom, rgba(2,4,9,0.55) 0%, rgba(0,0,0,0) 22%);
  }
  .grain {
    position:fixed; inset:-50%; pointer-events:none; z-index:6; opacity:.16;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.5'/></svg>");
    animation: grainShift 1.1s steps(2) infinite;
    mix-blend-mode:overlay;
  }
  @keyframes grainShift {
    0% { transform:translate(0,0); }
    50% { transform:translate(-2%,1.5%); }
    100% { transform:translate(1.5%,-1%); }
  }

  #fade {
    position:fixed; inset:0; background:#04060b; z-index:20; pointer-events:none;
    opacity:0; transition:opacity .7s ease;
  }

  /* ---------- HUD ---------- */
  .hud { position:fixed; z-index:8; pointer-events:none; opacity:0; transition:opacity 1.2s ease;
         text-shadow:0 1px 8px rgba(0,0,0,.9); }
  .hud.show { opacity:1; }

  #hud-left { left:26px; bottom:24px; font-size:12px; letter-spacing:.14em; color:#b9b0a0; }
  #hud-left .big { font-size:26px; letter-spacing:.06em; color:#efe6d3; font-weight:300;
                   font-variant-numeric:tabular-nums; }
  #hud-left .big span { font-size:11px; letter-spacing:.2em; color:#8d8272; margin-left:6px; }
  #hud-left .row { margin-top:6px; display:flex; gap:14px; align-items:center; }
  #hud-left .dot { width:4px; height:4px; border-radius:50%; background:#c8934a;
                   box-shadow:0 0 8px #e0a04a; display:inline-block; }

  #hud-right { right:26px; bottom:26px; font-size:11.5px; line-height:1.9; text-align:right;
               letter-spacing:.1em; color:#8f8676; }
  #hud-right b { color:#cfc4ae; font-weight:500; display:inline-block; min-width:64px;
                 border:1px solid rgba(200,190,170,.22); border-radius:3px; padding:0 6px;
                 text-align:center; font-size:10.5px; letter-spacing:.08em; margin-right:8px; }

  #place { position:fixed; z-index:8; left:26px; top:24px; opacity:0; transition:opacity 2s ease;
           pointer-events:none; font-size:11px; letter-spacing:.42em; color:#7d7568; }
  #place.show { opacity:1; }

  /* 字幕 / 氛围文字 */
  #caption {
    position:fixed; z-index:9; left:50%; bottom:16%; transform:translateX(-50%);
    font-size:15px; letter-spacing:.18em; color:#ded3bd; opacity:0;
    transition:opacity 2.2s ease; pointer-events:none; text-align:center; white-space:nowrap;
    text-shadow:0 2px 20px rgba(0,0,0,.95);
  }
  #caption.show { opacity:.92; }

  /* ---------- 开场 ---------- */
  #intro {
    position:fixed; inset:0; z-index:30; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:radial-gradient(ellipse at 50% 45%, #0a1220 0%, #05070d 55%, #020306 100%);
    transition:opacity 1.6s ease, visibility 1.6s;
  }
  #intro.hide { opacity:0; visibility:hidden; }
  #intro .line { font-size:11px; letter-spacing:.5em; color:#6f6759; margin-bottom:26px; }
  #intro h1 {
    font-size:46px; font-weight:200; letter-spacing:.3em; color:#efe7d6;
    margin-left:.3em; text-shadow:0 0 60px rgba(190,150,90,.25);
  }
  #intro .sub {
    margin-top:20px; font-size:13px; letter-spacing:.22em; color:#9a9080; line-height:2.1;
    max-width:460px;
  }
  #intro .hint { margin-top:8px; font-size:11.5px; letter-spacing:.18em; color:#6d6455; }
  #enter {
    margin-top:44px; padding:13px 46px; font-size:12.5px; letter-spacing:.34em;
    color:#e8dcc4; background:rgba(200,150,80,.07);
    border:1px solid rgba(210,170,110,.34); border-radius:2px; cursor:pointer;
    transition:all .5s ease; font-family:inherit;
  }
  #enter:hover { background:rgba(210,160,90,.16); border-color:rgba(225,185,120,.7);
                 color:#fff6e4; box-shadow:0 0 40px rgba(200,150,80,.18); }
  #enter:disabled { opacity:.4; cursor:default; }
  #loading { position:absolute; bottom:40px; font-size:10.5px; letter-spacing:.3em; color:#4e4a42; }

  /* ---------- 老收音机 ---------- */
  #radio {
    position:fixed; z-index:8; right:26px; bottom:104px; width:296px;
    opacity:0; transition:opacity 1.2s ease; pointer-events:none;
    font-variant-numeric:tabular-nums;
  }
  #radio.show { opacity:1; pointer-events:auto; }
  #radio .body {
    background:linear-gradient(160deg, rgba(30,21,12,.80) 0%, rgba(14,11,8,.86) 100%);
    border:1px solid rgba(208,166,104,.24);
    border-radius:3px; padding:11px 13px 9px;
    box-shadow:0 14px 44px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,220,170,.07);
    backdrop-filter:blur(3px);
  }
  #radio .top { display:flex; align-items:baseline; gap:7px; }
  #radio .freq {
    font-family:"SF Mono", Menlo, Consolas, monospace;
    font-size:21px; font-weight:400; letter-spacing:.02em; color:#f2c887;
    text-shadow:0 0 16px rgba(240,170,70,.55);
  }
  #radio .unit { font-size:9px; letter-spacing:.2em; color:#8a7250; }
  #radio .bars { margin-left:auto; display:flex; align-items:flex-end; gap:2px; height:12px; }
  #radio .bars i {
    display:block; width:2.5px; background:#c98a3e; border-radius:1px;
    opacity:.30; transition:opacity .35s ease, height .35s ease;
  }
  #radio .bars i.on { opacity:.95; }
  #radio .dial {
    position:relative; height:19px; margin:7px 0 9px;
    border-top:1px solid rgba(208,166,104,.15);
    border-bottom:1px solid rgba(208,166,104,.15);
    background:
      repeating-linear-gradient(to right, rgba(208,166,104,.30) 0 1px, transparent 1px 100%);
    background-size:8.2% 6px; background-repeat:repeat-x; background-position:0 0;
  }
  #radio .needle {
    position:absolute; top:-2px; width:1.5px; height:21px; background:#ffd9a0;
    box-shadow:0 0 9px 1px rgba(255,190,110,.85); border-radius:1px;
    transition:left .62s cubic-bezier(.3,.8,.3,1); left:0;
  }
  #radio .needle::after {
    content:''; position:absolute; left:-5px; top:-2px; width:11px; height:2px;
    background:#ffd9a0; border-radius:1px; opacity:.85;
  }
  #radio .now { min-height:30px; }
  #radio .title {
    font-size:11.5px; letter-spacing:.04em; color:#e7d6b8;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #radio .artist { font-size:10px; letter-spacing:.08em; color:#8d7b5f; margin-top:2px;
                   white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #radio .list {
    margin-top:8px; padding-top:7px; border-top:1px solid rgba(208,166,104,.13);
    max-height:0; overflow:hidden; transition:max-height .48s ease;
  }
  #radio.open .list { max-height:190px; overflow-y:auto; }
  #radio .row {
    display:flex; align-items:center; gap:8px; padding:3px 1px; cursor:pointer;
    border-radius:2px; transition:background .2s ease;
  }
  #radio .row:hover { background:rgba(212,164,100,.10); }
  #radio .row .no {
    font-family:"SF Mono", Menlo, monospace; font-size:9.5px; color:#7a6748; width:15px;
  }
  #radio .row .tt {
    font-size:10.5px; color:#c6b494; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; flex:1; letter-spacing:.02em;
  }
  #radio .row .fq { font-size:9px; color:#6f5f45; letter-spacing:.06em; }
  #radio .row.active .no { color:#f0bb72; }
  #radio .row.active .tt { color:#fdf0d8; }
  #radio .row.active .fq { color:#c9944e; }
  #radio .row.missing .tt { color:#5f5748; }
  #radio .row.missing .no { color:#4b4238; }
  #radio .row .tick {
    width:4px; height:4px; border-radius:50%; background:#4a4030; flex:none;
  }
  #radio .row.active .tick { background:#ffbe6e; box-shadow:0 0 7px #ff9d3a; }
  #radio .row.found .tick { background:#6b7a51; }
  #radio .hintline {
    margin-top:7px; padding-top:6px; border-top:1px solid rgba(208,166,104,.09);
    font-size:9.5px; letter-spacing:.01em; color:#5e5342; line-height:1.75;
  }
  #radio .actions { margin-top:7px; display:flex; gap:7px; }

  /* 叫车提示 */
  #callHint {
    position:fixed; left:50%; bottom:11%; z-index:9; pointer-events:none;
    transform:translateX(-50%) translateY(7px);
    font-size:11.5px; letter-spacing:.14em; color:#cbbfa8;
    padding:7px 15px; border:1px solid rgba(210,170,110,.20); border-radius:2px;
    background:rgba(18,14,9,.52); backdrop-filter:blur(2px);
    opacity:0; transition:opacity .55s ease, transform .55s ease;
    text-shadow:0 1px 8px rgba(0,0,0,.9); white-space:nowrap;
  }
  #callHint.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #callHint b {
    display:inline-block; min-width:15px; padding:1px 5px; margin-right:9px;
    border:1px solid rgba(200,190,170,.30); border-radius:3px;
    font-weight:500; font-size:10px; color:#f0e6d2; letter-spacing:.06em;
  }
  #radio .actions button {
    flex:1; padding:5px 0; font-family:inherit; font-size:9.5px; letter-spacing:.08em;
    color:#c3ad86; background:rgba(212,164,100,.07);
    border:1px solid rgba(208,166,104,.22); border-radius:2px; cursor:pointer;
    transition:all .25s ease;
  }
  #radio .actions button:hover {
    background:rgba(212,164,100,.16); border-color:rgba(220,176,112,.45); color:#f0e0c2;
  }
  #radio .actions button:active { transform:translateY(1px); }
  #radio.dragover .body { border-color:rgba(255,190,110,.75); box-shadow:0 0 26px rgba(220,150,60,.35); }
  #radio .toggle {
    position:absolute; right:11px; top:11px; cursor:pointer; color:#7d6a4c;
    font-size:10px; letter-spacing:.1em; user-select:none;
  }
  @media (max-width: 860px) {
    #radio { width:248px; right:16px; bottom:96px; }
    #radio .body { padding:9px 10px 7px; }
  }
</style>
</head>
<body>

<div id="intro">
  <div class="line">四 川 · 乡 道</div>
  <h1>20:30</h1>
  <div class="sub">坐在小皮卡上，路是略微破败的水泥路。<br/>远处有车开着远光，路边一盏盏泛黄的路灯往后退。</div>
  <div class="hint">建议戴上耳机</div>
  <button id="enter" disabled>进 入</button>
  <div id="loading">正在铺路…</div>
</div>

<div class="vignette"></div>
<div class="grain"></div>
<div id="fade"></div>

<div id="place">四川 · 某县乡道　20:30</div>
<div id="caption"></div>
<div id="callHint"><b>C</b>车在远处 · 喊一声让它开过来</div>

<div class="hud" id="hud-left">
  <div class="big"><span id="spd">0</span><span>km/h</span></div>
  <div class="row"><span class="dot"></span><span id="mode-text">副驾 · 行驶中</span></div>
</div>
<div class="hud" id="hud-right">
  <div><b>W A S D</b>走动</div>
  <div><b>E</b>下车 / 上车</div>
  <div><b>R</b>收音机　<b>M</b>静音</div>
  <div><b>H</b>隐藏</div>
</div>

<div id="radio">
  <div class="body">
    <div class="top">
      <span class="freq" id="rd-freq">96.4</span>
      <span class="unit">MHz&nbsp;FM</span>
      <span class="bars" id="rd-bars">
        <i></i><i></i><i></i><i></i><i></i>
      </span>
    </div>
    <div class="dial"><div class="needle" id="rd-needle"></div></div>
    <div class="now">
      <div class="title" id="rd-title">—</div>
      <div class="artist" id="rd-artist">未选台</div>
    </div>
    <div class="list" id="rd-list"></div>
    <div class="hintline" id="rd-hint">把音频文件放进 music/ 文件夹即可播原曲</div>
  </div>
  <div class="toggle" id="rd-toggle">收起</div>
</div>

<script>
/* 默认用随包的 three（本地和线上都不依赖外网）；地址栏加 ?cdn 才走 CDN。 */
(function () {
  var NPM = 'https://cdn.jsdelivr.net/npm/three@0.180.0/';
  var useCdn = /(?:^|[?&])cdn(?:[=&]|$)/.test(location.search);

  var map = useCdn
    ? { imports: { "three": NPM + "build/three.module.js", "three/addons/": NPM + "examples/jsm/" } }
    : { imports: { "three": "./js/three.module.js", "three/addons/": "./js/addons/" } };

  var im = document.createElement('script');
  im.type = 'importmap';
  im.textContent = JSON.stringify(map);
  document.head.appendChild(im);

  var m = document.createElement('script');
  m.type = 'module';
  m.src = './js/main.js';
  document.body.appendChild(m);
})();
</script>
</body>
</html>
